# Liquibase PostgreSQL 설정

# 기본 설정 포함
include=liquibase.properties

# PostgreSQL Driver
driver=org.postgresql.Driver

# 연결 정보 (환경변수 사용)
url=jdbc:postgresql://${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-corenextdb}
username=${DB_USER:-corenext}
password=${DB_PASSWORD}

# PostgreSQL 기본 스키마
defaultSchemaName=public
liquibaseSchemaName=public

# 추가 설정
outputDefaultSchema=false
outputDefaultCatalog=false
