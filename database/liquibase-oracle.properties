# Liquibase Oracle 설정

# 기본 설정 포함
include=liquibase.properties

# Oracle Driver
driver=oracle.jdbc.OracleDriver

# 연결 정보 (환경변수 사용)
# 형식: jdbc:oracle:thin:@//host:port/service_name
url=jdbc:oracle:thin:@//${DB_HOST:-localhost}:${DB_PORT:-1521}/${DB_SERVICE:-ORCL}
username=${DB_USER:-corenext}
password=${DB_PASSWORD}

# Oracle 스키마
defaultSchemaName=${DB_SCHEMA:-CORENEXT}
liquibaseSchemaName=${DB_SCHEMA:-CORENEXT}

# Oracle 특화 설정
outputDefaultSchema=true
outputDefaultCatalog=false
