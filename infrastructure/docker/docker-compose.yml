# Docker Compose - 서버 운영 환경
# 기존 docker/docker-compose.yml 기반으로 MSA 구조 확장
#
# 사용법:
#   docker-compose up -d                    # 전체 서비스 시작
#   docker-compose up -d backend frontend   # 특정 서비스만 시작
#   docker-compose logs -f auth-service     # 로그 확인
#
# 환경변수: .env 파일에서 로드

version: '3.8'

services:
  # ===== Infrastructure =====

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: corenext-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - corenext-network

  # Redis (Auth Service용 세션/토큰 관리)
  redis:
    image: redis:7-alpine
    container_name: corenext-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - corenext-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== Monitoring (선택사항) =====

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: corenext-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - corenext-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: corenext-grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - corenext-network
    profiles:
      - monitoring

  loki:
    image: grafana/loki:2.9.2
    container_name: corenext-loki
    ports:
      - "3101:3100"
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - corenext-network
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.2
    container_name: corenext-promtail
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - corenext-network
    profiles:
      - monitoring

  # ===== Application Services =====

  # Frontend Next.js Server
  frontend:
    build:
      context: ../..
      dockerfile: docker/frontend.Dockerfile
    container_name: corenext-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_AUTH_API_URL=/auth
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - corenext-network

  # Legacy Backend (기존 모놀리식 - 점진적 마이그레이션 중)
  backend:
    build:
      context: ../..
      dockerfile: docker/backend.Dockerfile
    container_name: corenext-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - DB_HOST=${DB_HOST:-123.37.36.45}
      - DB_PORT=${DB_PORT:-9090}
      - DB_NAME=${DB_NAME:-corenextdb}
      - DB_USER=${DB_USER:-corenext}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      # 첨부파일 저장소 - VM 스토리지 마운트
      - /data/uploads:/app/backend/uploads
    restart: unless-stopped
    networks:
      - corenext-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Auth Service (MSA - 인증 담당)
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: corenext-auth-service
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DB_HOST=${DB_HOST:-123.37.36.45}
      - DB_PORT=${DB_PORT:-9090}
      - DB_NAME=${DB_NAME:-corenextdb}
      - DB_USER=${DB_USER:-corenext}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://corenext-redis:6379
      - CORS_ORIGINS=http://localhost:3000,https://your-domain.com
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - corenext-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===== 향후 추가될 서비스 (주석 처리) =====

  # admin-service:
  #   build:
  #     context: ../..
  #     dockerfile: services/admin-service/Dockerfile
  #   container_name: corenext-admin-service
  #   ports:
  #     - "3012:3012"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3012
  #     - DB_HOST=${DB_HOST:-123.37.36.45}
  #     - DB_PORT=${DB_PORT:-9090}
  #     - DB_NAME=${DB_NAME:-corenextdb}
  #     - DB_USER=${DB_USER:-corenext}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - AUTH_SERVICE_URL=http://corenext-auth-service:3011
  #   restart: unless-stopped
  #   networks:
  #     - corenext-network

  # content-service:
  #   ...

  # communication-service:
  #   ...

  # common-service:
  #   ...

volumes:
  redis_data:
  uploads_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  corenext-network:
    driver: bridge
