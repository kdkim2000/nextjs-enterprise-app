# APISIX 기본 설정 - 서버 운영 환경

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_key:
    - name: admin
      key: "${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}"  # 프로덕션에서는 환경변수로 변경
      role: admin

deployment:
  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    https_admin: false

  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

  role: traditional
  role_traditional:
    config_provider: yaml

# 플러그인 설정
plugins:
  - jwt-auth
  - key-auth
  - cors
  - limit-req
  - limit-count
  - limit-conn
  - prometheus
  - proxy-rewrite
  - response-rewrite
  - ip-restriction
  - consumer-restriction
  - real-ip
  - request-id
  - opentelemetry

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091

  # Real IP 설정 (Nginx 뒤에서 실행될 때)
  real-ip:
    header: "X-Forwarded-For"
    recursive: true
    source: "http_x_forwarded_for"
