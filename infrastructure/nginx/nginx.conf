# Nginx 설정 - 서버 운영 환경
# Load Balancer + Reverse Proxy

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # 기본 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 설정
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 버퍼 설정
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 클라이언트 최대 요청 크기 (파일 업로드)
    client_max_body_size 50M;

    # Upstream 정의 (Docker Compose service name 사용)
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # MSA 서비스 (2개)
    # core-service: Auth + Admin + Common
    upstream core_service {
        server core-service:3011;
        keepalive 64;
    }

    # app-service: Content + Communication
    upstream app_service {
        server app-service:3012;
        keepalive 64;
    }

    # inspection-service: Checksheet templates, inspections, sync
    upstream inspection_service {
        server inspection-service:3013;
        keepalive 64;
    }

    # HTTP Server
    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        # ===== API Routes → MSA Services =====
        # API 요청만 백엔드로 프록시 (JSON 요청 또는 특정 API 엔드포인트)
        #
        # 참고: /admin, /auth 등의 경로는 Next.js 프론트엔드 페이지로도 사용됨
        # 따라서 API 요청만 백엔드로 라우팅하고, 페이지 요청은 프론트엔드로 전달

        # Auth API → core-service (로그인, 토큰 관련)
        location /auth/ {
            # API 요청만 백엔드로 (Accept: application/json 또는 특정 엔드포인트)
            if ($http_accept !~* "application/json") {
                # HTML 요청은 프론트엔드로
                rewrite ^(.*)$ /api-redirect$1 last;
            }
            proxy_pass http://core_service/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Admin API → core-service (사용자, 역할, 메뉴 관리 API)
        location /admin/ {
            # API 요청만 백엔드로
            if ($http_accept !~* "application/json") {
                rewrite ^(.*)$ /api-redirect$1 last;
            }
            proxy_pass http://core_service/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Common API → core-service (대시보드, 코드, 로그 등)
        location /common/ {
            if ($http_accept !~* "application/json") {
                rewrite ^(.*)$ /api-redirect$1 last;
            }
            proxy_pass http://core_service/common/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Content API → app-service (게시판, 도움말 등)
        location /content/ {
            if ($http_accept !~* "application/json") {
                rewrite ^(.*)$ /api-redirect$1 last;
            }
            proxy_pass http://app_service/content/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Communication API → app-service (메일, 메시지 등)
        location /comm/ {
            if ($http_accept !~* "application/json") {
                rewrite ^(.*)$ /api-redirect$1 last;
            }
            proxy_pass http://app_service/comm/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Inspection API → inspection-service (체크시트, 검사, 동기화)
        location /inspection/ {
            if ($http_accept !~* "application/json") {
                rewrite ^(.*)$ /api-redirect$1 last;
            }
            proxy_pass http://inspection_service/inspection/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # API Redirect fallback → Frontend (HTML 요청은 프론트엔드로)
        location /api-redirect {
            internal;
            rewrite ^/api-redirect(.*)$ $1 break;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check (core-service 기준)
        location /health {
            access_log off;
            proxy_pass http://core_service/health;
        }
    }

    # HTTPS Server (SSL 인증서 설정 후 활성화)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... (위와 동일한 location 블록들)
    # }

    # HTTP to HTTPS Redirect (SSL 설정 후 활성화)
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
