services:
  postgres16:
    image: postgres:16.11
    container_name: pg16
    env_file: .env
    ports:
      - "9090:5432"
    volumes:
      - pg16_pgdata_16_11:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - corenext-network

  # Backend API Server
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: corenext-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - DB_HOST=postgres16
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      - postgres16
    networks:
      - corenext-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Next.js Server
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: corenext-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - corenext-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: corenext-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - corenext-network

volumes:
  pg16_pgdata_16_11:
    external: true

networks:
  corenext-network:
    driver: bridge
